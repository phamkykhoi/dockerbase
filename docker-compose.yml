services:
  # Nginx Web Server
  nginx:
    build:
      context: ./docker/services/nginx
      dockerfile: nginx.dockerfile
    working_dir: /var/www
    volumes:
      - ${APP_CODE_PATH_HOST}:/var/www
    ports:
      - "80:80"
    depends_on:
      - php73
      - php74
      - php81
      - php82
      - php83
      - php84

  # PHP Services
  php73:
    build:
      context: ./docker/services/php7.3
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ${APP_CODE_PATH_HOST}:/var/www
    environment:
      - PHP_VERSION=7.3

  php74:
    build:
      context: ./docker/services/php7.4
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ${APP_CODE_PATH_HOST}:/var/www
    environment:
      - PHP_VERSION=7.4

  php81:
    build:
      context: ./docker/services/php8.1
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ${APP_CODE_PATH_HOST}:/var/www
    environment:
      - PHP_VERSION=8.1

  php82:
    build:
      context: ./docker/services/php8.2
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ${APP_CODE_PATH_HOST}:/var/www
    environment:
      - PHP_VERSION=8.2

  php83:
    build:
      context: ./docker/services/php8.3
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ${APP_CODE_PATH_HOST}:/var/www
    environment:
      - PHP_VERSION=8.3

  php84:
    build:
      context: ./docker/services/php8.4
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ${APP_CODE_PATH_HOST}:/var/www
    environment:
      - PHP_VERSION=8.4
  # MySQL Databases - Version 5.7 and 8.x
  mysql57:
    platform: linux/x86_64
    image: mysql:5.7
    container_name: mysql57
    restart: always
    volumes:
      - ./docker/volumes/mysql57:/var/lib/mysql
    environment:
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"

  mysql8:
    platform: linux/x86_64
    image: mysql:8.0
    container_name: mysql8
    restart: always
    volumes:
      - ./docker/volumes/mysql8:/var/lib/mysql
    environment:
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3308:3306"

  # Legacy support - keep old names for backward compatibility
  # database:
  #   platform: linux/x86_64
  #   image: mysql:5.7
  #   container_name: database
  #   restart: always
  #   volumes:
  #     - ./docker/volumes/mysql:/var/lib/mysql
  #   environment:
  #     MYSQL_USER: ${DB_USERNAME}
  #     MYSQL_PASSWORD: ${DB_PASSWORD}
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  #   ports:
  #     - "3307:3306"
  #minio file management
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    command:
        - server
        - --console-address
        - :9001
        - /data
    ports:
        - 9000:9000
        - 9001:9001
    environment:
        MINIO_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
        MINIO_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
        MINIO_REGION_NAME: ${AWS_DEFAULT_REGION}
        MINIO_DEFAULT_BUCKETS: ${AWS_BUCKET}
    volumes:
        - ./docker/minio/data:/data
  # Postgress
  pgsql:
    image: postgres
    restart: always
    environment:
      PGPASSWORD: '${DC_DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DC_DB_DATABASE}'
      POSTGRES_USER: '${DC_DB_USERNAME}'
      POSTGRES_PASSWORD: '${DC_DB_PASSWORD:-secret}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

  #phpmyadmin
  phpmyadmin:
    build: ./docker/services/phpmyadmin
    environment:
      PMA_ARBITRARY: 1
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      UPLOAD_LIMIT: 100000M
    ports:
      - "8888:80"
    depends_on:
      - "mysql57"
  # Caching
  redis:
    image: redis:alpine
    volumes:
      - ./docker/volumes/redis:/data
    ports:
      - "6378:6379"
